<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>せつやく番長</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="せつやく番長" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0D1B2A; --sub:#6B7A8C; --mute:#94A3B8;
  --line:#E8ECF1; --bg:#FFFFFF; --soft:#F7F9FB;
  --red:#E8192C; --redL:#FFF5F6; --redB:#FFD9DE;
  --blue:#2563EB; --blueL:#EFF4FF;
  --green:#16A34A; --greenL:#EAF7EF;
  --purple:#7C3AED; --purpleL:#F3EEFF;
  --amber:#F59E0B; --amberL:#FEF6E7;
}
html{background:var(--bg)}
body{font-family:"Noto Sans JP",-apple-system,"Hiragino Sans",sans-serif;color:var(--ink);
  background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;
  padding:12px 16px calc(74px + env(safe-area-inset-bottom));}
.wrap{max-width:520px;margin:0 auto}

/* ============ ヘッダー ============ */
.hd{display:flex;align-items:center;gap:11px;padding:6px 0 14px}
.hd img{width:38px;height:38px;border-radius:9px;flex:0 0 auto}
.hdT{font-size:19px;font-weight:700;letter-spacing:.01em;line-height:1.25}
.hdS{font-size:11px;font-weight:700;color:var(--green);margin-top:1px}
.hdR{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.hdT,.hdS{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd,.trust{display:none}   /* 狭い画面では出さない（その他タブに同じ情報がある） */
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto}
.iconbtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{font-size:11px;color:var(--mute);white-space:nowrap}
.trust{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.trust.高{border-color:#BBF7D0;background:#F0FDF4;color:#15803D}
.trust.中{border-color:#FDE68A;background:#FFFBEB;color:#B45309}
.trust.低{border-color:var(--redB);background:var(--redL);color:var(--red)}

/* ============ カード共通 ============ */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.cardT{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.cardT svg{width:19px;height:19px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cardS{font-size:12px;color:var(--sub);margin-top:3px}
.pgT{font-size:23px;font-weight:700;padding:2px 0 2px}
.pgS{font-size:13px;color:var(--sub);margin:4px 0 16px;line-height:1.7}
.sqi{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sqi svg{width:21px;height:21px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.b-blue{background:var(--blueL)}.b-blue svg{stroke:var(--blue)}
.b-green{background:var(--greenL)}.b-green svg{stroke:var(--green)}
.b-purple{background:var(--purpleL)}.b-purple svg{stroke:var(--purple)}
.b-amber{background:var(--amberL)}.b-amber svg{stroke:var(--amber)}
.b-red{background:var(--redL)}.b-red svg{stroke:var(--red)}
.link{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:13px;
  font-weight:700;color:var(--blue);cursor:pointer;padding-top:11px}
.link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ============ 危機カード ============ */
/* ★詰めて組むこと。1画面に「危機カード＋タイル＋見通し」が入らないと、
   いちばん見せたい不足額しか見えず、かえって使いにくくなる（実際になった）。 */
.crisis{position:relative;border:1px solid var(--redB);background:var(--redL);
  border-radius:14px;padding:13px 14px;margin-bottom:10px;overflow:hidden}
.crisis.ok{border-color:#BBF7D0;background:#F0FDF4}
.crH{display:flex;gap:9px;padding-right:78px}
.bang{width:28px;height:28px;border-radius:50%;background:var(--red);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.crisis.ok .bang{background:var(--green)}
.bang svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.8;stroke-linecap:round}
.ttl{font-size:17.5px;font-weight:700;color:var(--red);line-height:1.42;letter-spacing:-.02em}
.crisis.ok .ttl{color:#15803D}
/* 番長は上部にしか掛からないので、この行は右の余白を空けない（1行に収める） */
.crSub{font-size:12px;font-weight:700;margin:7px 0 0;line-height:1.55}
/* ★カードの外にはみ出させないこと（切れて見えると指摘された）。
   ここは背の低い素材（胸から上）を使う。全身だと金額の行に重なる。 */
.msc{position:absolute;right:8px;top:8px;width:78px;height:auto}
.rows{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:11px;padding:0 12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 0;border-bottom:1px solid #F1F4F8}
.row:last-child{border-bottom:0}
.rowL{font-size:11.5px;color:var(--sub);line-height:1.35}
.rowV{font-size:15.5px;font-weight:700;white-space:nowrap}
.row.dg .rowL{color:var(--red);font-weight:700}
.row.dg .rowV{color:var(--red);font-size:16.5px}
.cta{width:100%;margin-top:11px;padding:12px;border:0;border-radius:10px;background:var(--red);
  color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px}
.cta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ============ 数字タイル（モックアップと同じ横3つ） ============ */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.tile{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff;min-width:0}
.tile .sqi{width:22px;height:22px;border-radius:7px;margin-bottom:5px}
.tile .sqi svg{width:13px;height:13px}
.tileL{font-size:9.5px;color:var(--sub);line-height:1.35;min-height:26px}
.tileV{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ============ 見通し ============ */
.ms{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;text-align:center}
.msb{padding:8px 4px;border-right:1px solid var(--line)}
.msb:last-child{border-right:0}
.msT{font-size:12px;font-weight:700}
.msD{font-size:10.5px;color:var(--mute);margin:1px 0 5px}
.msV{font-size:15px;font-weight:700}
.neg{color:var(--red)}.pos{color:var(--green)}
.chart{width:100%;height:auto;display:block;margin:10px 0 0}
.foot{font-size:10.5px;color:var(--mute);margin-top:9px;line-height:1.7}

/* ============ 対策カード ============ */
.ac{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px;background:#fff}
.ac.on{border-color:var(--green);background:#F6FDF8}
.acH{display:flex;gap:11px;align-items:flex-start}
.acT{font-size:14.5px;font-weight:700;line-height:1.45}
.acD{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.6}
.acF{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid #F1F4F8}
.acE{font-size:10.5px;color:var(--mute);line-height:1.3}
.acA{font-size:14px;font-weight:700;color:var(--ink)}
.pill{margin-left:auto;padding:9px 15px;border:0;border-radius:9px;color:#fff;font-family:inherit;
  font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.p-green{background:var(--green)}.p-blue{background:var(--blue)}
.p-purple{background:var(--purple)}.p-gray{background:#E2E8F0;color:#475569}
.chip{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:99px;
  background:var(--green);color:#fff;font-size:10px;font-weight:700;vertical-align:2px}
.info{display:flex;gap:11px;align-items:center;background:var(--soft);border:1px solid var(--line);
  border-radius:13px;padding:13px 14px;margin-bottom:11px}
.res{border-radius:11px;padding:13px 14px;font-size:13px;line-height:1.7;margin-bottom:11px}
.res.ok{background:#EAF7EF;color:#14532D}.res.ng{background:var(--redL);color:#9F1239}

/* ============ 表 ============ */
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
th{font-size:11px;color:var(--mute);font-weight:400;text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
td{padding:11px 4px;border-bottom:1px solid #F4F7FA;white-space:nowrap}
td.d{color:var(--mute);font-size:11.5px}
td.n{max-width:0;width:99%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.a{text-align:right;font-weight:700;color:var(--red)}
td.a.pos{color:var(--green)}
td.l{text-align:right;font-size:11px;color:var(--mute);padding-left:10px}
td.l.soon{color:var(--red);font-weight:700}

/* ============ 番長のひとこと ============ */
.say{display:flex;gap:12px;align-items:flex-end;background:var(--soft);
  border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.sayT{flex:1;min-width:0}
.sayH{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sayH svg{width:17px;height:17px;stroke:var(--amber);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sayB{font-size:12.5px;line-height:1.75;color:#334155}
.say img{width:74px;height:auto;flex:0 0 auto}

/* ============ タブ ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tb{flex:1;border:0;background:none;font-family:inherit;font-size:10px;color:var(--mute);
  padding:3px 0;cursor:pointer;font-weight:500}
.tb svg{width:22px;height:22px;display:block;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--blue);font-weight:700}

/* ============ 入力シート（下から出るやつ） ============
   prompt() は素っ気ないうえ、ホーム画面から開いたPWAでは出ないことがある。 */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(13,27,42,.42);animation:fade .2s ease-out}
.sheet .in{width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:4px}
.sheet .foot{margin:0 0 14px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px;font-weight:700}
.fld input{width:100%;padding:13px;font-family:inherit;font-size:16px;border:1px solid #CBD5E1;
  border-radius:11px;background:#fff;color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.fld .hint{font-size:11px;color:var(--mute);margin-top:5px}
.sheet .btns{display:flex;gap:9px;margin-top:6px}
.sheet .btns button{flex:1;padding:14px;border:0;border-radius:11px;font-family:inherit;
  font-size:15px;font-weight:700;cursor:pointer}
.sheet .ok{background:var(--green);color:#fff}
.sheet .no{background:#EEF2F6;color:#475569}
.sheet .bad{background:var(--redL);border:1px solid var(--redB);color:#9F1239;
  padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px}
@media(min-width:1000px){
  .sheet{align-items:center}
  .sheet .in{border-radius:18px;max-width:420px;padding:24px}
}

/* ============ 合言葉／読み込み ============ */
.gate{max-width:340px;margin:0 auto;padding:44px 0 0;text-align:center}
.gate>img{width:82px;height:82px;border-radius:19px;border:1px solid var(--line)}
.gate h1{font-size:21px;margin-top:15px}
.gate .hdS{font-size:12.5px;margin-top:3px}
.gate .card{margin-top:20px;text-align:left}
.gate input{width:100%;padding:13px;margin:7px 0 11px;font-family:inherit;font-size:16px;
  border:1px solid #CBD5E1;border-radius:11px;background:#fff;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.gate button{width:100%;padding:14px;border:0;border-radius:11px;background:var(--blue);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
/* ---- スプラッシュ（読み込み中） ----
   静止画を1枚貼るのではなく、パーツを分けて少しずつ動かしている。
   あとで動画に差し替えたくなったら .spMascot の img を video に替えるだけでよい。 */
.sp{position:fixed;inset:0;background:#fff;z-index:60;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:11vh;animation:spIn .5s ease-out}
.sp.out{animation:spOut .45s ease-in forwards;pointer-events:none}
@keyframes spIn{from{opacity:0}to{opacity:1}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
/* ★読み込み画面の背景は白のままにすること。ブランド素材はステッカー仕様で
   白フチが付いており、背景に色を敷くとフチが「枠」として浮き出る（指摘された）。 */
.spSym{width:112px;height:auto;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.spName{font-size:34px;font-weight:700;letter-spacing:.01em;margin-top:12px;
  animation:up .6s .12s ease-out both}
.spName i{font-style:normal;color:var(--green)}
.spTag{font-size:14px;font-weight:700;color:#334155;margin-top:7px;
  animation:up .6s .22s ease-out both}
/* ★画面の下辺にくっつけないこと。ブランド素材の番長は胸から上の「ステッカー」で、
   下辺に接するとキャラが見切れて見える（実際に見切れて見えた）。
   全体が入る大きさで、下に余白を残して置く。 */
/* 番長の置き場。静止画と動画を重ねて、動画が再生できたら入れ替える。
   ★必ず全身が入っている素材を使うこと。胸から上の素材や、下辺に接する置き方は
     キャラが見切れて見える（何度もやり直しになった）。ぼかしで誤魔化さない。 */
.spStage{position:relative;height:34vh;aspect-ratio:424/1073;max-width:44vw;margin:auto 0 5vh}
.spPoster,.spVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  transition:opacity .5s}
/* ★合成は .spStage 側に掛けること。子要素に掛けると .spStage の中だけで合成され、
   後ろの緑の波と混ざらず、白い四角が残る（実際に残った）。 */
.spStage{animation:up .7s .3s ease-out both, float 3.4s 1s ease-in-out infinite}
/* 生成された動画の白地は純白ではなく薄いグレー。multiply だと四角い箱が見えるので
   darken で合成する（背景より明るい画素は背景が勝つため、白地が自然に消える）。
   わずかに明るさを上げて、白地が確実に背景より明るくなるようにしている。 */
.spVid{opacity:0}
.sp.hasVideo .spPoster{opacity:0}
.sp.hasVideo .spVid{opacity:1}
/* 動画側が動くので、CSSの揺れは止める（二重に揺らさない） */
.sp.hasVideo .spStage{animation:up .7s .3s ease-out both}
.spBadges{position:absolute;left:16px;bottom:24vh;display:flex;flex-direction:column;gap:14px}
.spB{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);
  box-shadow:0 3px 10px rgba(13,27,42,.08);display:flex;align-items:center;justify-content:center;
  animation:up .5s ease-out both}
.spB:nth-child(1){animation-delay:.45s}
.spB:nth-child(2){animation-delay:.6s}
.spB:nth-child(3){animation-delay:.75s}
.spB svg{width:21px;height:21px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spMsg{margin-top:26px;font-size:11.5px;color:var(--mute);
  animation:blink 1.6s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-9px) rotate(-1.1deg)}}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .sp *{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
.load{text-align:center;padding:26vh 20px;color:var(--mute);font-size:13px}
.load img{width:64px;border-radius:15px;margin-bottom:15px}
.err{background:var(--redL);border:1px solid var(--redB);color:#9F1239;
  padding:14px;border-radius:12px;font-size:13px;line-height:1.8}
.busy{background:var(--blueL);border:1px solid #DBE7FF;color:#1E40AF;
  padding:13px 14px;border-radius:12px;font-size:13px;margin-bottom:12px;font-weight:700}
.busy .bar{height:4px;border-radius:99px;background:#DBE7FF;margin-top:9px;overflow:hidden}
.busy .bar i{display:block;height:100%;width:34%;border-radius:99px;background:var(--blue);
  animation:slide 1.5s ease-in-out infinite}
@keyframes slide{0%{margin-left:-34%}100%{margin-left:100%}}
.busy small{display:block;font-weight:400;font-size:11.5px;margin-top:5px;opacity:.8}
.done{background:var(--greenL);border:1px solid #BBF7D0;color:#15803D;
  padding:13px 14px;border-radius:12px;font-size:13px;margin-bottom:12px;font-weight:700}
.kL{font-size:12px;color:var(--sub);font-weight:700}
.sep{height:1px;background:var(--line);margin:13px 0}
.kV{font-size:18px;font-weight:700;margin-top:2px}
.err button{margin-top:11px;padding:10px 18px;border:0;border-radius:9px;background:var(--red);
  color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
/* 押した感触。スマホだとこれが無いと反応したか分からない */
.cta:active,.pill:active,.err button:active,.iconbtn:active{transform:scale(.97);opacity:.9}
.tb:active,.link:active{opacity:.6}

/* ============ PC ============ */
@media(min-width:1000px){
  body{padding:20px 26px 46px}
  .wrap{max-width:1340px}
  .hd{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .hd img{width:52px;height:52px;border-radius:12px}
  .hdT{font-size:26px}.hdS{font-size:13px}
  .upd,.trust{display:block}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .crisis{padding:24px 26px}
  .crH{padding-right:150px}
  .ttl{font-size:clamp(24px,2.3vw,32px)}
  .crSub{font-size:15px;padding-right:210px}
  .msc{width:150px;right:18px;top:12px}
  .rows{display:grid;grid-template-columns:repeat(3,1fr);padding:0;margin-top:18px}
  .row{display:block;border-bottom:0;border-right:1px solid var(--line);padding:14px 16px}
  .row span{display:block}   /* ラベルを上、金額を下に積む（モックアップと同じ） */
  .row:last-child{border-right:0}
  .rowV{font-size:21px;margin-top:5px}
  .cta{width:auto;padding:13px 26px;margin-left:auto}
  .tiles{grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{padding:14px}
  .tile .sqi{width:34px;height:34px}.tile .sqi svg{width:18px;height:18px}
  .tileL{font-size:11.5px}.tileV{font-size:22px}
  .card{padding:19px 20px;margin-bottom:16px}
  .pgT{font-size:20px}
  .fcw{display:grid;grid-template-columns:1fr 216px;gap:18px;align-items:center}
  .ms{grid-template-columns:1fr;margin-top:0;text-align:left}
  .msb{border-right:0;border-bottom:1px solid var(--line);padding:12px 4px}
  .msb:last-child{border-bottom:0}
  .msV{font-size:20px}
  table{font-size:13px}
  .say img{width:110px}
  .tabs{display:none}
}
</style>
</head>
<body>
<div class="sp" id="sp">

  <img class="spSym" src="assets/symbol.png" alt="" />
  <div class="spName">せつやく<i>番長</i></div>
  <div class="spTag">資金のピンチは、俺が止める。</div>
  <div class="spBadges">
    <span class="spB"><svg viewBox="0 0 24 24" stroke="#16A34A"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>
    <span class="spB"><svg viewBox="0 0 24 24" stroke="#FF6B8A"><path d="M3.5 12.5c0-3.6 3.4-6 7.5-6 1.3 0 2.5.2 3.6.7l2.6-1.6-.5 3a5.9 5.9 0 012 3.2l2.3.8-1.6 2.5v2.4h-3l-1 1.6h-2.6l-.9-1.4a12 12 0 01-2.6 0l-.9 1.4H5.9l-1-1.7c-.9-1.2-1.4-2.7-1.4-4.9z"/><circle cx="8" cy="12" r="1"/></svg></span>
    <span class="spB"><svg viewBox="0 0 24 24" stroke="#16A34A"><path d="M4 19V11M9.5 19V5M15 19v-6M20.5 19V8"/></svg></span>
  </div>
  <div class="spMsg" id="spMsg">読み込んでいます…</div>
  <!-- 動画（Higgsfield生成）と静止画を重ねている。動画が再生できたときだけ入れ替わるので、
       動画を消しても・読めなくても静止画のまま動く。
       動画は正方形で周りに余白があるため、拡大して余白を隠している。 -->
  <div class="spStage">
    <img class="spPoster" src="assets/mascot-body.png" alt="" />
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============================================================
   せつやく番長 ｜ 画面
   計算はすべてスプレッドシート(GAS)側。この画面は表示するだけ。
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyAbsZDTQ-T1PFfaep0yO9BY3TbPD9ArQL2MpX9w0JQJFkx4Y2GhYr145_RHo_7WAUL/exec';

const qs = new URLSearchParams(location.search);
if (qs.get('k')) localStorage.setItem('banchou_key', qs.get('k'));
const KEY = localStorage.getItem('banchou_key') || '';

let DATA = null, TAB = 'home', BUSY = false;

const yen  = n => '¥' + Math.round(Math.abs(Number(n) || 0)).toLocaleString('ja-JP');
const syen = n => (Number(n) < 0 ? '−' : '') + yen(n);
const esc  = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 日付は空だったり欠けていたりする。必ずこれを通してから日付として扱うこと。
   素で Date に渡すと "Invalid time value" で画面が真っ白になる。 */
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
/* toISOString はUTCなので、日本時間の朝9時前は前日になってしまう。日付は必ずこれで作る。 */
const ymd = (dt = new Date()) => [dt.getFullYear(),
  String(dt.getMonth() + 1).padStart(2, '0'),
  String(dt.getDate()).padStart(2, '0')].join('-');
const md   = d => isDate(d) ? Number(d.slice(5,7)) + '月' + Number(d.slice(8,10)) + '日' : '';
const md0  = d => isDate(d) ? d.slice(5,7) + '月' + d.slice(8,10) + '日' : '';

const P = {
  bang:'<path d="M12 6v7M12 17v.1"/>',
  check:'<path d="M20 6L9 17l-4-4"/>',
  arrow:'<path d="M5 12h13M12 6l6 6-6 6"/>',
  refresh:'<path d="M20.5 11a8.5 8.5 0 10-2.4 6"/><path d="M20.5 4.5v6.5h-6.5"/>',
  wallet:'<path d="M3 7.5h14.5A2.5 2.5 0 0120 10v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7.5zm0 0L5.5 4H17"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  life:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/><path d="M6 6l3.6 3.6M18 6l-3.6 3.6M6 18l3.6-3.6M18 18l-3.6-3.6"/>',
  down:'<path d="M12 4.5v11M7.5 11.5L12 16l4.5-4.5M4.5 19.5h15"/>',
  up:'<path d="M12 19.5v-11M7.5 12.5L12 8l4.5 4.5M4.5 4.5h15"/>',
  trend:'<path d="M3 16.5l5.5-6 4 3.5 5-6.5"/><path d="M21 4.5h-4M21 4.5v4"/>',
  people:'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.9-4.6 5.5-4.6S14 16 14.6 19"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M16 14.6c2.2.2 3.9 1.8 4.4 4.4"/>',
  bank:'<path d="M3.5 9.5L12 4.5l8.5 5"/><path d="M5.5 9.5v8M9.5 9.5v8M14.5 9.5v8M18.5 9.5v8M3 20.5h18"/>',
  card:'<rect x="2.8" y="5.5" width="18.4" height="13" rx="2.4"/><path d="M2.8 10h18.4M6.5 14.5h3.5"/>',
  q:'<circle cx="12" cy="12" r="8.6"/><path d="M9.7 9.6a2.4 2.4 0 114 1.9c-.9.7-1.7 1.1-1.7 2.3M12 17v.1"/>',
  bulb:'<path d="M9.2 17.5h5.6M10 20.5h4"/><path d="M12 3.5a5.6 5.6 0 00-3.3 10.1c.5.4.8 1 .8 1.6h5c0-.6.3-1.2.8-1.6A5.6 5.6 0 0012 3.5z"/>',
  mail:'<rect x="2.8" y="5" width="18.4" height="14" rx="2.4"/><path d="M3.4 6.6l8.6 6 8.6-6"/>',
  home:'<path d="M4 11l8-6.6 8 6.6v8.2a1 1 0 01-1 1h-4.5V14h-5v6.2H5a1 1 0 01-1-1V11z"/>',
  bolt:'<path d="M13.2 3L5.5 13.6h5.6L10.4 21l7.9-10.6h-5.7L13.2 3z"/>',
  list:'<rect x="4" y="3.4" width="16" height="17.2" rx="2.6"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/>',
  dots:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
  shield:'<path d="M12 3.4l7.4 3v5c0 4.5-3 8.5-7.4 9.8C7.6 19.9 4.6 15.9 4.6 11.4v-5l7.4-3z"/>',
  spark:'<path d="M12 3.5l1.7 4.8 4.8 1.7-4.8 1.7L12 16.5l-1.7-4.8-4.8-1.7 4.8-1.7L12 3.5z"/>'
};
const sq = (n, tone) => `<span class="sqi b-${tone}"><svg viewBox="0 0 24 24">${P[n]}</svg></span>`;
const arw = () => `<svg viewBox="0 0 24 24">${P.arrow}</svg>`;

/* ---------- 通信 ----------
   JSONP（scriptタグ）で GAS を呼ぶ。
   ★fetch の POST は使わない。GAS のリダイレクトの都合で JSON ではなく
     HTML のエラーページが返ることがある（実際に踏んだ）。 */
/* ---------- スプラッシュ ---------- */
const SP_AT = Date.now();
/* 取得に10秒前後かかる。同じ文言のままだと固まって見えるので、進み具合を出す */
(function () {
  const el = document.getElementById('spMsg');
  const steps = ['読み込んでいます', '残高を確認しています', '将来残高を計算しています', 'もう少しかかります'];
  const t = setInterval(() => {
    if (!document.getElementById('sp')) return clearInterval(t);
    el.textContent = steps[Math.min(steps.length - 1, Math.floor((Date.now() - SP_AT) / 4000))] + '…';
  }, 900);
})();
/* 動画が実際に再生できたときだけ、CSSの揺れを止める */
(function () {
  const v = document.querySelector('.spVid');
  if (v) {
    v.addEventListener('playing', () => document.getElementById('sp')?.classList.add('hasVideo'), { once: true });
  }
})();
function hideSp() {
  if (qs.get('splash')) return;   // ?splash=1 で出しっぱなしにできる（見た目の確認用）
  const sp = document.getElementById('sp');
  if (!sp || sp.classList.contains('out')) return;
  setTimeout(() => {
    sp.classList.add('out');
    setTimeout(() => sp.remove(), 500);
  }, Math.max(0, 1100 - (Date.now() - SP_AT)));   // 一瞬で消えるとチラつくので最低1.1秒は出す
}

let JN = 0;
function api(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cb = 'bcb' + (++JN);
    const q = new URLSearchParams({ api: action, k: KEY, callback: cb });
    const tok = sessionStorage.getItem('banchou_tok');
    if (tok) q.set('t', tok);
    if (params.act) q.set('act', params.act);
    if (params.payload) q.set('p', JSON.stringify(params.payload));
    const s = document.createElement('script');
    let fired = false;
    const t = setTimeout(() => { done(); reject(new Error('時間切れです。もう一度お試しください。')); }, 240000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { fired = true; done(); resolve(d); };
    /* ★GASはときどきJSONではなくHTMLのページを返す。その場合 script は読み込みに
       成功するのに callback が呼ばれないので、onload で取りこぼしを検出する。
       これが無いとタイムアウトまで待たされる（240秒固まっていた）。 */
    s.onload = () => { if (!fired){ done(); reject(new Error('応答を読み取れませんでした')); } };
    s.onerror = () => { done(); reject(new Error('通信できませんでした')); };
    s.src = GAS_URL + '?' + q.toString();
    document.head.appendChild(s);
  });
}

/* ---------- グラフ ---------- */
function chart(fc) {
  const pts = fc.points || [];
  if (pts.length < 2) return '';
  /* スマホでは横に引き伸ばされて軸の文字が読めなくなるので、
     viewBox を細長くして文字を大きく取る（実測して決めた値） */
  const narrow = window.innerWidth < 700;
  const W  = narrow ? 400 : 720;
  const H  = narrow ? 330 : 320;
  const PL = narrow ? 58  : 78;
  const PR = narrow ? 12  : 18;
  const PT = narrow ? 24  : 26;
  const PB = narrow ? 28  : 34;
  const FS = narrow ? 13  : 10.5;   // 軸ラベル
  const FB = narrow ? 15  : 11;     // 吹き出し
  let lo = 0, hi = 0;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  if (hi === lo) hi = lo + 1;
  let step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 5)));
  while ((hi - lo) / step > 8) step *= 2;
  hi = Math.ceil(hi / step) * step; lo = Math.floor(lo / step) * step;
  const man = v => Math.abs(v) >= 10000
    ? (v < 0 ? '−' : '') + (Math.round(Math.abs(v) / 1000) / 10) + '万'
    : String(Math.round(v));
  const X = i => PL + (W - PL - PR) * (i / (pts.length - 1));
  const Y = v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo));

  let line = '', area = '';
  pts.forEach((p, i) => { line += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1); });
  area = line + ` L${X(pts.length-1).toFixed(1)} ${Y(lo).toFixed(1)} L${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z`;

  let g = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="将来残高の見通し">`;
  g += `<text x="3" y="${PT-9}" font-size="${FS}" fill="#94A3B8">(円)</text>`;
  for (let v = lo; v <= hi + step/2; v += step) {
    const y = Y(v);
    g += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${Math.abs(v)<step/2?'#CBD5E1':'#F0F3F7'}"/>`;
    g += `<text x="${PL-7}" y="${(y+FS*0.36).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="${v<0?'#E8192C':'#94A3B8'}">${man(v)}</text>`;
  }
  g += `<path d="${area}" fill="#2563EB" opacity=".08"/>`;
  g += `<path d="${line}" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round"/>`;

  if (fc.firstNeg) {
    const ni = pts.findIndex(p => p[0] === fc.firstNeg.date);
    if (ni >= 0) {
      const cx = X(ni), cy = Y(pts[ni][1]);
      g += `<line x1="${cx.toFixed(1)}" y1="${PT}" x2="${cx.toFixed(1)}" y2="${H-PB}" stroke="#E8192C" stroke-width="1.3" opacity=".55"/>`;
      g += `<line x1="${PL}" y1="${cy.toFixed(1)}" x2="${W-PR}" y2="${cy.toFixed(1)}" stroke="#E8192C" stroke-width="1.3" stroke-dasharray="6 4" opacity=".55"/>`;
      g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5.5" fill="#fff" stroke="#E8192C" stroke-width="3"/>`;
      const bw = narrow ? 128 : 132, bh = narrow ? 46 : 42;
      // 不足地点が左寄りなら吹き出しは右へ。線の上に重ねない
      const bx = cx < (PL + W - PR) / 2
        ? Math.min(W - PR - bw, cx + 14)
        : Math.max(PL, cx - bw - 14);
      const by = Math.max(PT, cy - bh - 22);
      g += `<path d="M${bx} ${by+9}a9 9 0 019-9h${bw-18}a9 9 0 019 9v${bh-18}a9 9 0 01-9 9h-${bw-18-16}l-8 11-3-11h-2a9 9 0 01-9-9z" fill="#E8192C"/>`;
      g += `<text x="${bx+bw/2}" y="${by+(narrow?18:17)}" text-anchor="middle" font-size="${FB-2}" font-weight="700" fill="#fff">${esc(fc.firstNeg.date.slice(5).replace('-','/'))}に不足</text>`;
      g += `<text x="${bx+bw/2}" y="${by+(narrow?37:33)}" text-anchor="middle" font-size="${FB}" font-weight="700" fill="#fff">−${yen(fc.firstNeg.bal).slice(1)}</text>`;
    }
  }
  const every = Math.max(1, Math.round(pts.length / (narrow ? 4 : 7)));
  for (let t = 0; t < pts.length; t += every)
    g += `<text x="${X(t).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="${FS}" fill="#94A3B8">${Number(pts[t][0].slice(5,7))}/${Number(pts[t][0].slice(8,10))}</text>`;
  return g + '</svg>';
}

/* ---------- 対策カードの組み立て ---------- */
function actionCards(d) {
  const short = d.funds.short, out = [];
  const simOn = {};
  (d.actions.sims || []).forEach(s => { simOn[s.type + '|' + (s.label || '')] = s; });

  const card = (key, tone, icon, title, desc, effLabel, effVal, btn, pill, attrs) => {
    const on = simOn[key];
    return `<div class="ac${on ? ' on' : ''}">
      <div class="acH">${sq(icon, tone)}<div style="min-width:0">
        <div class="acT">${title}${on ? '<span class="chip">反映中</span>' : ''}</div>
        <div class="acD">${desc}</div></div></div>
      <div class="acF">
        <div><div class="acE">${effLabel}</div><div class="acA">${effVal}</div></div>
        ${on ? `<button class="pill p-gray" data-act="remove" data-id="${esc(on.id)}">取り消す</button>`
             : `<button class="pill p-${pill}" ${attrs}>${btn}${arw()}</button>`}
      </div></div>`;
  };

  if (d.funds.sub > 0) {
    const need = short < 0 ? Math.min(Math.abs(short), d.funds.sub) : d.funds.sub;
    // 引落日が無いこともあるので、その場合は「明日」を振替日にする
    const base = isDate(d.funds.due) ? new Date(d.funds.due.replace(/-/g, '/')) : new Date();
    base.setDate(base.getDate() + (isDate(d.funds.due) ? -1 : 1));
    const td = ymd(base);
    out.push(card('transfer|個人口座からの振替', 'blue', 'bank',
      `${esc(d.mode.sub)}の ${yen(need)} を<br>${esc(d.mode.main)}へ振り替え`,
      `引落の前日（${esc(td)}）に振り替える想定です`,
      '想定効果', '〜' + yen(need), '振り替える', 'blue',
      `data-act="transfer" data-amount="${need}" data-date="${td}"`));
  }

  out.push(card('__income', 'green', 'people',
    '取引先に入金の前倒しを相談',
    '入金予定を登録すると、見通しに反映されます',
    '想定効果', '登録した金額', '入金を登録', 'green', 'data-act="incoming"'));

  (d.actions.picks || []).slice(0, 3).forEach(p => {
    out.push(card('stopfix|' + p.name, 'green', 'trend',
      `${esc(p.name)} を止める`,
      `月額 ${yen(p.monthly)}／仕分け：${esc(p.tri)}`,
      '来月からの効果', yen(p.monthly) + '/月', '止める', 'green',
      `data-act="stopfix" data-label="${esc(p.name)}" data-amount="${p.monthly}"`));
  });

  if (d.funds.card > 0 && isDate(d.funds.due))
  out.push(`<div class="ac"><div class="acH">${sq('card','purple')}<div style="min-width:0">
      <div class="acT">カードの支払い方法を相談</div>
      <div class="acD">引落 ${esc(d.funds.due)}／${yen(d.funds.card)}。分割や支払日の変更を相談します</div>
    </div></div>
    <div class="acF"><div><div class="acE">想定効果</div><div class="acA">金額は変わりません</div></div>
    <span class="pill p-purple" style="opacity:.55;cursor:default">電話で相談</span></div></div>`);

  return out.join('');
}

/* ---------- 画面 ---------- */
function render() {
  hideSp();
  const d = DATA;
  const short = d.funds.short, ng = short < 0;

  /* --- 危機カード --- */
  /* ★カード引落日は無いことがある（その月に請求が無い・導入直後）。
     日付が空のまま日付処理に渡すと画面が真っ白になる（実際になった）。 */
  const due = isDate(d.funds.due) ? d.funds.due : '';
  const negDay = d.forecast.firstNeg && isDate(d.forecast.firstNeg.date)
    ? d.forecast.firstNeg.date : '';
  const day = due || negDay;

  const ttl = ng
    ? (day ? `${md0(day)}に、<br>${yen(short)}不足します。` : `${yen(short)}足りません。`)
    : (due ? `${md0(due)}の引落後も<br>${yen(short)}残ります。` : `いまのところ<br>支払いは間に合っています。`);

  const crisis = `<div class="crisis ${ng ? 'ng' : 'ok'} sect" data-tab="home">
    <img class="msc" src="assets/mascot-${ng ? 'warn' : 'ok'}.png" alt="" />
    <div class="crH">
      <div class="bang"><svg viewBox="0 0 24 24">${ng ? P.bang : P.check}</svg></div>
      <div class="ttl">${ttl}</div>
    </div>
    ${ng && day ? `<div class="crSub">${md0(day)}までに${yen(short)}を確保してください。</div>` : ''}
    <div class="rows">
      <div class="row"><span class="rowL">${esc(d.mode.main)}</span><span class="rowV">${yen(d.funds.main)}</span></div>
      ${due ? `<div class="row"><span class="rowL">次回のカード引落（${esc(due)}）</span><span class="rowV">−${yen(d.funds.card).slice(1)}</span></div>`
            : `<div class="row"><span class="rowL">次回のカード引落</span><span class="rowV">予定なし</span></div>`}
      <div class="row ${ng ? 'dg' : ''}"><span class="rowL">${ng ? '不足見込み額' : (due ? '引落後の残高' : '見込み残高')}</span><span class="rowV">${syen(short)}</span></div>
    </div>
    <button class="cta" data-go="act">対策を確認${arw()}</button>
  </div>`;

  /* --- 数字タイル --- */
  const tile = (tone, icon, label, val) =>
    `<div class="tile">${sq(icon, tone)}<div class="tileL">${label}</div><div class="tileV">${val}</div></div>`;
  // 事業資金は危機カードに出ているので、タイルは重複させず3つに絞る
  const tiles = `<div class="tiles sect" data-tab="home">
    ${tile('amber','life', esc(d.mode.sub), yen(d.funds.sub))}
    ${tile('green','down', '今月の入金<br>（取得済み分）', yen(d.month.inc))}
    ${tile('red','up', '今月の支払<br>（取得済み分）', yen(d.month.exp))}
  </div>`;

  /* --- 見通し --- */

      .map(([t,l,i]) => `<button class="tb${t===TAB?' on':''}" data-t="${t}"><svg viewBox="0 0 24 24">${P[i]}</svg>${l}</button>`).join('')}

function showTab(t) {
  TAB = t;
  const pc = getComputedStyle(document.querySelector('.tabs')).display === 'none';
  document.querySelectorAll('.sect').forEach(el => {
    const own = el.getAttribute('data-tab');
    // PCでは1画面に全部並べる。ただし「その他」と、スマホ用の簡易カード(.mob)は出さない
    el.style.display = (pc ? (own !== 'etc' && !el.classList.contains('mob')) : own === t) ? '' : 'none';
  });
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.getAttribute('data-t') === t));
  if (!pc) window.scrollTo(0, 0);
}

/* ---------- 入金予定の登録シート ----------
   金額と日付は、送る前にこちら側で必ず確かめる。
   GAS側に変な値が入ると、直すのにスプレッドシートを開くことになるため。 */
function askIncome() {
  const today = new Date();
  const d0 = ymd(new Date(today.getTime() + 7 * 86400000));
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="in">
    <h3>入金予定を登録する</h3>
    <div class="foot">登録すると、将来残高の見通しにすぐ反映されます。</div>
    <div id="ierr"></div>
    <div class="fld"><label>金額</label>
      <input id="iamt" type="text" inputmode="numeric" placeholder="200000" />
      <div class="hint">半角数字だけ。円マークやカンマは要りません</div></div>
    <div class="fld"><label>入金予定日</label>
      <input id="idate" type="date" value="${d0}" /></div>
    <div class="fld"><label>入金元（任意）</label>
      <input id="ilbl" type="text" placeholder="◯◯商事" /></div>
    <div class="btns">
      <button class="no" id="ino">やめる</button>
      <button class="ok" id="iok">登録する</button>
    </div></div>`;
  document.body.appendChild(el);
  setTimeout(() => document.getElementById('iamt').focus(), 60);

  return new Promise(resolve => {
    const close = v => { el.remove(); resolve(v); };
    el.addEventListener('click', e => { if (e.target === el) close(null); });
    document.getElementById('ino').onclick = () => close(null);
    document.getElementById('iok').onclick = () => {
      const bad = m => { document.getElementById('ierr').innerHTML = `<div class="bad">${esc(m)}</div>`; };
      // 日本語キーボードだと全角で入る。半角に直してから読む（弾かれて入力できなかった）
      const half = String(document.getElementById('iamt').value)
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const amt = Number(half.replace(/[^\d]/g, ''));
      const dt = document.getElementById('idate').value;
      if (!amt) return bad('金額を入れてください。');
      if (amt > 100000000) return bad('金額が大きすぎます。桁を確かめてください。');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return bad('入金予定日を選んでください。');
      if (dt < ymd()) return bad('過去の日付は登録できません。');
      close({ amount: String(amt), date: dt,
              label: document.getElementById('ilbl').value.trim() || '入金予定' });
    };
  });
}

/* ---------- Googleログイン ----------
   スプレッドシート側で「GoogleログインのクライアントID」が設定されたときだけ、
   サーバが needLogin を返す。設定されていない間はこの画面は一切出ない。
   ★入る道だけでなく出る道（ログインし直す・やめる）も必ず用意すること。 */
const GOOGLE_CLIENT_ID = '';   // ← Kaiがクライアントを作ったらここに入れる

function askLogin(msg) {
  hideSp();
  document.getElementById('app').innerHTML = `
  <div class="gate">
    <img src="icon-192.png" alt="" />
    <h1>せつやく番長</h1><div class="hdS">資金のピンチは、俺が止める。</div>
    ${msg ? `<div class="err" style="margin-top:18px">${esc(msg)}</div>` : ''}

      <div class="rowL" style="margin-bottom:10px">Googleアカウントでログインしてください</div>

      <button class="pill p-gray" style="margin:12px 0 0" data-act="logout">合言葉に戻す</button>

  document.head.appendChild(s);
}

/* ---------- 操作 ---------- */
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('.tb');       if (tb) return showTab(tb.getAttribute('data-t'));
  const go = ev.target.closest('[data-go]'); if (go) return showTab(go.getAttribute('data-go'));

  const btn = ev.target.closest('#btn');
  if (btn) {
    if (BUSY) return;
    BUSY = true; btn.classList.add('spin');
    const msg = document.getElementById('msg');
    /* ★1回で全部やらないこと。まとめると3分かかり、スマホで画面を離れた時点で
       結果を受け取れず「更新できない」ように見える（実際にそう見えていた）。
       取り込み(約6秒)と再計算(約70秒)に分けて、それぞれの結果を出す。 */
    const t0 = Date.now();
    let tick = null;
    const say = (label, note) => {
      clearInterval(tick);
      const start = Date.now();
      const draw = () => {
        const s = Math.round((Date.now() - start) / 1000);
        msg.innerHTML = `<div class="busy">${esc(label)}…
          <div class="bar"><i></i></div><small>${esc(note)}／経過 ${s}秒</small></div>`;
      };
      draw(); tick = setInterval(draw, 1000);
    };
    /* ★時間のかかる処理は再試行しないこと。
       応答が届かなかっただけで、サーバ側では動き続けている。
       再試行すると二重に走り、ロック待ちで倍以上待たされる（実際に175秒待たされた）。
       取り込みは数秒で終わり重複も除かれるので、そこだけ再試行する。 */
    const step = async (action, label, note, retry) => {
      say(label, note);
      let r, err;
      for (let i = 0; i < (retry ? 2 : 1); i++) {
        try { r = await api(action); break; }
        catch (e2) { err = e2; if (retry) await new Promise(x => setTimeout(x, 1500)); }
      }
      if (!r) throw err || new Error('応答がありませんでした');
      if (!r.ok) throw new Error(r.error || '失敗しました');
      return r;
    };
    try {
      const imp = await step('import', 'メールを取り込んでいます', '数秒で終わります', true);
      let lost = false;
      try {
        await step('rebuild', '取引を集計して将来残高を計算しています', '1分ほどかかります', false);
      } catch (e3) {
        // 応答は届かなかったが、集計自体は続いている。少し待ってから結果を見に行く
        lost = true;
        say('集計の結果を待っています', 'もう少しかかります');
        await new Promise(x => setTimeout(x, 20000));
      }
      clearInterval(tick);
      await load();
      const sec = Math.round((Date.now() - t0) / 1000);
      document.getElementById('msg').innerHTML =
        `<div class="done">${imp.added > 0
            ? `メールから ${imp.added} 件を取り込みました。`
            : '新しいメールはありませんでした。'}${lost ? '' : `集計を更新しました（${sec}秒）。`}</div>`;
    } catch (e) {
      clearInterval(tick);
      msg.innerHTML = `<div class="err">更新できませんでした：${esc(e.message)}
        <button data-act="reload">もう一度試す</button></div>`;
    }
    btn.classList.remove('spin');
    BUSY = false;
    return;
  }

  const el = ev.target.closest('[data-act], [data-act2]');
  if (!el) return;
  const a = el.getAttribute('data-act') || el.getAttribute('data-act2');

  if (a === 'reload') { location.reload(); return; }
  if (a === 'logout') {
    localStorage.removeItem('banchou_key');
    sessionStorage.removeItem('banchou_tok');
    location.href = location.pathname;
    return;
  }

  const p = {};
  if (a === 'transfer') { p.amount = el.getAttribute('data-amount'); p.date = el.getAttribute('data-date'); }
  else if (a === 'stopfix') { p.label = el.getAttribute('data-label'); p.amount = el.getAttribute('data-amount'); }
  else if (a === 'remove' || a === 'incok' || a === 'incng') { p.id = el.getAttribute('data-id'); }
  else if (a === 'incoming') {
    const v = await askIncome();
    if (!v) return;
    Object.assign(p, v);
  }
  const was = el.tagName === 'BUTTON' ? el.innerHTML : null;
  if (was !== null) { el.disabled = true; el.style.opacity = '.5'; el.textContent = '反映中…'; }
  try {
    // 通信は取りこぼすことがある。ここも黙って2回まで取り直す
    let ok, err;
    for (let i = 0; i < 2; i++) {
      try { ok = await api('sim', { act: a, payload: p }); break; }
      catch (e2) { err = e2; await new Promise(r => setTimeout(r, 1200)); }
    }
    if (!ok) throw err || new Error('反映できませんでした');
    if (!ok.ok) throw new Error(ok.error || '反映できませんでした');
    await load();
  } catch (e) {
    /* ★失敗したらボタンを必ず元に戻すこと。
       戻さないと「反映中…」のまま押せなくなり、再読み込みするしかなくなる。 */
    if (was !== null) { el.disabled = false; el.style.opacity = ''; el.innerHTML = was; }
    const m = document.getElementById('msg');
    if (m) {
      m.innerHTML = `<div class="err">反映できませんでした：${esc(e.message)}
        <button data-act="reload">もう一度試す</button></div>`;
      m.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
});

/* ---------- 起動 ---------- */
async function load() {
  if (!KEY) { askKey(''); return; }
  try {
    // GASはときどきJSONを返さない。実測で3回に1回ほど起きるので、黙って取り直す
    let d, last;
    for (let i = 0; i < 3; i++) {
      try { d = await api('stats'); break; }
      catch (e) {
        last = e;
        if (/合言葉/.test(String(e.message))) throw e;
        await new Promise(r => setTimeout(r, 1200 * (i + 1)));
      }
    }
    if (!d) throw last || new Error('取得できませんでした');
    if (!d.ok && d.needLogin) { sessionStorage.removeItem('banchou_tok'); askLogin(d.error); return; }
    if (!d.ok) throw new Error(d.error || '取得できませんでした');
    DATA = d; render();
  } catch (e) {
    const m = String(e.message || '');
    if (/合言葉/.test(m)) { localStorage.removeItem('banchou_key'); askKey('合言葉が違います。もう一度入れてください。'); return; }
    hideSp();
    document.getElementById('app').innerHTML =
      `<div class="err"><b>データを取得できませんでした。</b><br>${esc(m)}
       <button data-act="reload">もう一度試す</button></div>`;
  }
}
window.addEventListener('resize', () => { if (DATA) showTab(TAB); });
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
