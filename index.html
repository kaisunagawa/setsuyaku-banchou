<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>せつやく番長</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="せつやく番長" />
<meta name="theme-color" content="#111F30" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* 番長＝学ラン。濃紺と金と警告色。淡い青のSaaS配色はやめる */
  --ink:#0B1622; --slab:#111F30; --slab2:#1B2E44;
  --paper:#fff; --wash:#F7F8FA;
  --rule:#E4E8ED; --hair:#EFF2F5;
  --sub:#5F6E7E; --mute:#94A2B1;
  --red:#D80B2B; --redW:#FFF4F5; --redL:#F7C9D0;
  --alert:#FF5064;             /* 濃紺の上でだけ使う赤 */
  --go:#16A34A; --goW:#EDF8F1;
  --gold:#FFBF24;
  --blue:#1F5FD6;
  --purple:#6D3BE0;
}
html{background:var(--paper)}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans",-apple-system,sans-serif;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;
  line-height:1.6;letter-spacing:.01em;
  padding:10px 18px calc(80px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.num{font-family:Anton,"Zen Kaku Gothic New",sans-serif;font-weight:400;
  letter-spacing:.005em;font-feature-settings:"tnum";font-variant-numeric:tabular-nums}

/* ============ ヘッダー ============ */
.hd{display:flex;align-items:center;gap:10px;padding:8px 0 16px}
.hd>img{width:34px;height:34px;border-radius:8px;flex:0 0 auto}
.hdT{font-size:17px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.hdS{font-size:10.5px;font-weight:700;color:var(--go);margin-top:2px;letter-spacing:.04em}
.hdR{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
.hdT,.hdS{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd,.trust{display:none}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{font-size:11px;color:var(--mute);white-space:nowrap}
.trust{font-size:10.5px;font-weight:700;padding:5px 10px;border:1.5px solid var(--rule);white-space:nowrap}
.trust.高{border-color:var(--go);color:var(--go)}
.trust.中{border-color:var(--gold);color:#9A6B00}
.trust.低{border-color:var(--red);color:var(--red)}

/* ============ 見出し ============ */
/* 箱で囲まない。罫線と余白で区切る。囲むほど画面が狭く見える */
.pgT{font-size:24px;font-weight:900;letter-spacing:.01em;line-height:1.3;padding-top:4px}
.pgS{font-size:12.5px;color:var(--sub);margin:6px 0 18px;line-height:1.75}
.cardT{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;letter-spacing:.01em}
.cardT svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cardS{font-size:12px;color:var(--sub);margin-top:3px}
.sec{margin-bottom:26px}
.secH{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;margin-bottom:14px;
  border-bottom:2px solid var(--ink)}
.secH b{font-size:13.5px;font-weight:900;letter-spacing:.06em}
.secH span{margin-left:auto;font-size:11.5px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--rule);padding:16px;margin-bottom:12px}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;
  color:var(--ink);cursor:pointer;padding-top:12px;border-bottom:2px solid var(--gold);
  padding-bottom:2px;letter-spacing:.02em}
.link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sqi{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  border:1.5px solid var(--ink)}
.sqi svg{width:19px;height:19px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--ink)}
.b-blue,.b-green,.b-purple,.b-amber,.b-red{background:#fff}
.b-green{border-color:var(--go)} .b-green svg{stroke:var(--go)}
.b-blue{border-color:var(--blue)} .b-blue svg{stroke:var(--blue)}
.b-purple{border-color:var(--purple)} .b-purple svg{stroke:var(--purple)}
.b-amber{border-color:#C98A00} .b-amber svg{stroke:#C98A00}
.b-red{border-color:var(--red)} .b-red svg{stroke:var(--red)}

/* ============ 判決（このアプリの主役） ============
   ここだけ濃紺で塗る。ほかを静かにして、この一枚に全部を語らせる */
.crisis{position:relative;background:var(--slab);color:#fff;padding:0;margin-bottom:24px;
  overflow:hidden}
.crisis::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;
  background:repeating-linear-gradient(115deg,var(--gold) 0 13px,var(--slab) 13px 26px)}
.crisis.ok::before{background:repeating-linear-gradient(115deg,var(--go) 0 13px,var(--slab) 13px 26px)}
.crIn{padding:24px 18px 18px;position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:900;
  letter-spacing:.14em;color:var(--gold);margin-bottom:12px}
.crisis.ok .eyebrow{color:#7DE0A4}
.eyebrow i{display:block;width:16px;height:2px;background:currentColor}
.ttl{font-size:23px;font-weight:900;line-height:1.35;letter-spacing:.01em;color:#fff}
.ttl .num{font-family:Anton,inherit;font-weight:400}
.ttl .amt{display:block;font-family:Anton,inherit;font-weight:400;
  font-size:clamp(40px,13vw,60px);line-height:1;margin:8px 0 0;color:var(--alert)}
.ttl .tail{font-size:19px;font-weight:900}
.crisis.ok .ttl .amt{color:#7DE0A4}
.crSub{font-size:12.5px;color:#B7C4D2;margin-top:14px;max-width:23em;line-height:1.7}
/* ★右端や下端にはみ出させないこと。切れて見えると指摘された。
   全身が枠の内側に完全に収まる位置・大きさにする。 */
/* ★数字の上に重ねないこと。番長は見出しの右の余白にだけ置き、
   その分だけ見出し側に余白を取る。行や金額には一切かからないようにする。 */
.msc{position:absolute;right:14px;top:26px;width:84px;height:auto;z-index:0;
  filter:drop-shadow(0 8px 20px rgba(0,0,0,.45))}
.eyebrow,.ttl,.crSub{padding-right:96px}
.spark{display:block;width:100%;height:auto;margin-top:16px}
.rows{border-top:1px solid rgba(255,255,255,.14);margin-top:16px;position:relative;z-index:1}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
.rowL{font-size:11.5px;color:#93A4B6;letter-spacing:.02em}
.rowV{font-size:17px;font-weight:700;white-space:nowrap;color:#fff;
  font-variant-numeric:tabular-nums}
.row.dg .rowL{color:var(--alert)}
.row.dg .rowV{color:var(--alert);font-size:19px}
.cta{width:100%;margin:18px 0 0;padding:15px;border:0;background:var(--alert);
  color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2}
.crisis.ok .cta{background:var(--go)}
.cta svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ============ 数字（囲まない。罫線で並べる） ============ */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);
  border-bottom:1px solid var(--rule);margin-bottom:24px}
.tile{padding:13px 10px 14px;border-right:1px solid var(--hair);min-width:0}
.tile:last-child{border-right:0}
.tile .sqi{display:none}
.tileL{font-size:10px;color:var(--sub);line-height:1.45;min-height:29px;letter-spacing:.02em}
.tileV{font-size:19px;font-weight:700;margin-top:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

/* ============ 見通し ============ */
.ms{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;
  border-top:1px solid var(--rule)}
.msb{padding:12px 6px;border-right:1px solid var(--hair)}
.msb:last-child{border-right:0}
.msT{font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--sub)}
.msD{font-size:10px;color:var(--mute);margin:2px 0 6px}
.msV{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.neg{color:var(--red)}.pos{color:var(--go)}
.chart{width:100%;height:auto;display:block;margin:6px 0 0}
.foot{font-size:11px;color:var(--mute);margin-top:11px;line-height:1.8}

/* ============ 対策 ============ */
.ac{border:1px solid var(--rule);border-left:3px solid var(--ink);
  padding:15px;margin-bottom:12px;background:#fff}
.ac.on{border-color:var(--go);border-left-color:var(--go);background:var(--goW)}
.acH{display:flex;gap:12px;align-items:flex-start}
.acT{font-size:14.5px;font-weight:900;line-height:1.5;letter-spacing:.01em}
.acD{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.7}
.acF{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--hair)}
.acE{font-size:10px;color:var(--mute);letter-spacing:.06em;font-weight:700}
.acA{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{margin-left:auto;padding:11px 16px;border:0;color:#fff;font-family:inherit;
  font-size:12.5px;font-weight:900;cursor:pointer;white-space:nowrap;letter-spacing:.03em;
  display:flex;align-items:center;gap:6px}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.p-green{background:var(--go)}.p-blue{background:var(--blue)}
.p-purple{background:var(--purple)}.p-gray{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.chip{display:inline-block;margin-left:8px;padding:3px 8px;background:var(--go);color:#fff;
  font-size:9.5px;font-weight:900;letter-spacing:.08em;vertical-align:2px}
.info{display:flex;gap:12px;align-items:center;background:var(--wash);
  padding:14px;margin-bottom:12px}
.res{padding:14px;font-size:13px;line-height:1.8;margin-bottom:14px;border-left:3px solid}
.res.ok{background:var(--goW);border-color:var(--go);color:#0F5132}
.res.ng{background:var(--redW);border-color:var(--red);color:#8B0B22}
/* 文中に流し込まれて読めなくなるので、リンクは必ず改行して置く */
.res .link{display:flex;width:fit-content;margin-top:4px}

/* ============ 表 ============ */
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
th{font-size:10px;color:var(--mute);font-weight:900;letter-spacing:.08em;text-align:left;
  padding:8px 4px;border-bottom:2px solid var(--ink)}
td{padding:12px 4px;border-bottom:1px solid var(--hair);white-space:nowrap;
  font-variant-numeric:tabular-nums}
td.d{color:var(--mute);font-size:11px}
td.n{max-width:0;width:99%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:normal}
td.a{text-align:right;font-weight:700;color:var(--red)}
td.a.pos{color:var(--go)}
td.l{text-align:right;font-size:10.5px;color:var(--mute);padding-left:10px}
td.l.soon{color:var(--red);font-weight:900}

/* ============ 番長のひとこと ============ */
.say{display:flex;gap:14px;align-items:flex-end;background:var(--slab);color:#fff;
  padding:16px 16px 0;margin-bottom:24px;overflow:hidden}
.sayT{flex:1;min-width:0;padding-bottom:18px}
.sayH{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--gold);
  display:flex;align-items:center;gap:7px;margin-bottom:9px}
.sayH svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sayB{font-size:13px;line-height:1.8;color:#DCE5EE;font-weight:500}
.say>img{width:96px;height:auto;flex:0 0 auto;margin-bottom:-2px}

/* ============ タブ ============ */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:2px solid var(--ink);z-index:20;
  padding:0 0 env(safe-area-inset-bottom)}
.tb{flex:1;border:0;background:none;font-family:inherit;font-size:9.5px;color:var(--mute);
  padding:10px 0 9px;cursor:pointer;font-weight:700;letter-spacing:.04em;
  border-top:3px solid transparent;margin-top:-2px}
.tb svg{width:21px;height:21px;display:block;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--ink);border-top-color:var(--gold)}

/* ============ 状態表示 ============ */
.kL{font-size:10.5px;color:var(--sub);font-weight:900;letter-spacing:.08em}
.kV{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--rule);margin:14px 0}
.err{background:var(--redW);border-left:3px solid var(--red);color:#8B0B22;
  padding:14px;font-size:13px;line-height:1.8;margin-bottom:12px}
.err button{margin-top:11px;padding:11px 18px;border:0;background:var(--red);
  color:#fff;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer}
.busy{background:var(--slab);color:#fff;padding:14px;font-size:13px;margin-bottom:12px;font-weight:700}
.busy .bar{height:3px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}
.busy .bar i{display:block;height:100%;width:34%;background:var(--gold);
  animation:slide 1.5s ease-in-out infinite}
@keyframes slide{0%{margin-left:-34%}100%{margin-left:100%}}
.busy small{display:block;font-weight:400;font-size:11px;margin-top:6px;color:#A9BACB}
.done{background:var(--goW);border-left:3px solid var(--go);color:#0F5132;
  padding:14px;font-size:13px;margin-bottom:12px;font-weight:700}
.cta:active,.pill:active,.err button:active,.iconbtn:active{transform:translateY(1px);opacity:.92}
.tb:active,.link:active{opacity:.55}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ============ 入力シート ============ */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(11,22,34,.55);animation:fade .2s ease-out}
.sheet .in{width:100%;max-width:480px;background:#fff;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:rise .26s cubic-bezier(.2,.9,.3,1);
  border-top:4px solid var(--ink)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:18px;font-weight:900;margin-bottom:4px}
.sheet .foot{margin:0 0 16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10.5px;color:var(--sub);margin-bottom:6px;
  font-weight:900;letter-spacing:.08em}
.fld input{width:100%;padding:14px;font-family:inherit;font-size:16px;border:1.5px solid var(--rule);
  background:#fff;color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--ink)}
.fld .hint{font-size:11px;color:var(--mute);margin-top:6px}
.sheet .btns{display:flex;gap:10px;margin-top:6px}
.sheet .btns button{flex:1;padding:15px;border:0;font-family:inherit;
  font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.03em}
.sheet .ok{background:var(--go);color:#fff}
.sheet .no{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sheet .bad{background:var(--redW);border-left:3px solid var(--red);color:#8B0B22;
  padding:11px 13px;font-size:12.5px;margin-bottom:13px}

/* ============ 合言葉 ============ */
.gate{max-width:340px;margin:0 auto;padding:44px 0 0;text-align:center}
.gate>img{width:78px;height:78px}
.gate h1{font-size:22px;font-weight:900;margin-top:16px;letter-spacing:.02em}
.gate .hdS{font-size:12px;margin-top:4px}
.gate .card{margin-top:22px;text-align:left;border-top:4px solid var(--ink)}
.gate input{width:100%;padding:14px;margin:8px 0 12px;font-family:inherit;font-size:16px;
  border:1.5px solid var(--rule);background:#fff;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--ink)}
.gate button{width:100%;padding:15px;border:0;background:var(--ink);
  color:#fff;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;letter-spacing:.04em}

/* ============ スプラッシュ ============ */
.sp{position:fixed;inset:0;background:#fff;z-index:60;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:11vh;animation:spIn .5s ease-out}
.sp.out{animation:spOut .45s ease-in forwards;pointer-events:none}
@keyframes spIn{from{opacity:0}to{opacity:1}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
/* ★スプラッシュの背景は白のままにすること。
   ブランド素材はステッカー仕様で白フチが付いており、
   背景に色を敷くとフチが「枠」として浮き出る（実際に指摘された）。 */
.spSym{width:104px;height:auto;animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.spName{font-size:32px;font-weight:900;letter-spacing:.02em;margin-top:14px;
  animation:up .6s .12s ease-out both}
.spName i{font-style:normal;color:var(--go)}
.spTag{font-size:13px;font-weight:700;color:var(--sub);margin-top:8px;letter-spacing:.04em;
  animation:up .6s .22s ease-out both}
/* 素材は背景透過済み。合成モードは使わない（使うと色がにごる） */
.spStage{position:relative;height:34vh;aspect-ratio:424/1073;max-width:44vw;margin:auto 0 5vh;
  animation:up .7s .3s ease-out both, float 3.4s 1s ease-in-out infinite}
.spPoster,.spVid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .5s}
.spVid{opacity:0}
.sp.hasVideo .spPoster{opacity:0}
.sp.hasVideo .spVid{opacity:1}
.sp.hasVideo .spStage{animation:up .7s .3s ease-out both}
.spBadges{position:absolute;left:16px;bottom:24vh;display:flex;flex-direction:column;gap:14px}
.spB{width:42px;height:42px;background:#fff;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;animation:up .5s ease-out both}
.spB:nth-child(1){animation-delay:.45s}
.spB:nth-child(2){animation-delay:.6s}
.spB:nth-child(3){animation-delay:.75s}
.spB svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spMsg{margin-top:26px;font-size:11px;color:var(--mute);letter-spacing:.06em;
  animation:blink 1.6s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.sp *,.spStage{animation-duration:.01ms!important;animation-iteration-count:1!important}}
.load{text-align:center;padding:26vh 20px;color:var(--mute);font-size:13px}
.load img{width:64px;margin-bottom:15px}

/* ============ PC ============ */
@media(min-width:1000px){
  body{padding:22px 30px 60px}
  .wrap{max-width:1320px}
  .hd{padding:4px 0 18px;border-bottom:2px solid var(--ink);margin-bottom:24px}
  .hd>img{width:46px;height:46px}
  .hdT{font-size:24px}.hdS{font-size:12px}
  .upd,.trust{display:block}

<body>
<div class="sp" id="sp">

  <img class="spSym" src="assets/symbol.png" alt="" />
  <div class="spName">せつやく<i>番長</i></div>
  <div class="spTag">資金のピンチは、俺が止める。</div>
  <div class="spBadges">
    <span class="spB"><svg viewBox="0 0 24 24" stroke="#16A34A"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/></svg></span>
    <span class="spB"><svg viewBox="0 0 24 24" stroke="#FF6B8A"><path d="M3.5 12.5c0-3.6 3.4-6 7.5-6 1.3 0 2.5.2 3.6.7l2.6-1.6-.5 3a5.9 5.9 0 012 3.2l2.3.8-1.6 2.5v2.4h-3l-1 1.6h-2.6l-.9-1.4a12 12 0 01-2.6 0l-.9 1.4H5.9l-1-1.7c-.9-1.2-1.4-2.7-1.4-4.9z"/><circle cx="8" cy="12" r="1"/></svg></span>

  <!-- 動画（Higgsfield生成）と静止画を重ねている。動画が再生できたときだけ入れ替わるので、
       動画を消しても・読めなくても静止画のまま動く。
       動画は正方形で周りに余白があるため、拡大して余白を隠している。 -->
  <div class="spStage">
    <img class="spPoster" src="assets/mascot-body.png" alt="" />
    <!-- 透過webm/mp4を assets/mascot-body.webm として置けば、ここに video を戻せる。
         ただし白フチの無い素材から作り直すこと（焼き込まれると枠に見える） -->
  </div>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============================================================
   せつやく番長 ｜ 画面
   計算はすべてスプレッドシート(GAS)側。この画面は表示するだけ。
   ============================================================ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyAbsZDTQ-T1PFfaep0yO9BY3TbPD9ArQL2MpX9w0JQJFkx4Y2GhYr145_RHo_7WAUL/exec';

const qs = new URLSearchParams(location.search);
if (qs.get('k')) localStorage.setItem('banchou_key', qs.get('k'));
const KEY = localStorage.getItem('banchou_key') || '';

let DATA = null, TAB = 'home', BUSY = false;

const yen  = n => '¥' + Math.round(Math.abs(Number(n) || 0)).toLocaleString('ja-JP');
const syen = n => (Number(n) < 0 ? '−' : '') + yen(n);
const esc  = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 日付は空だったり欠けていたりする。必ずこれを通してから日付として扱うこと。
   素で Date に渡すと "Invalid time value" で画面が真っ白になる。 */
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
/* toISOString はUTCなので、日本時間の朝9時前は前日になってしまう。日付は必ずこれで作る。 */
const ymd = (dt = new Date()) => [dt.getFullYear(),
  String(dt.getMonth() + 1).padStart(2, '0'),
  String(dt.getDate()).padStart(2, '0')].join('-');
const md   = d => isDate(d) ? Number(d.slice(5,7)) + '月' + Number(d.slice(8,10)) + '日' : '';
const md0  = d => isDate(d) ? d.slice(5,7) + '月' + d.slice(8,10) + '日' : '';

const P = {
  bang:'<path d="M12 6v7M12 17v.1"/>',
  check:'<path d="M20 6L9 17l-4-4"/>',
  arrow:'<path d="M5 12h13M12 6l6 6-6 6"/>',
  refresh:'<path d="M20.5 11a8.5 8.5 0 10-2.4 6"/><path d="M20.5 4.5v6.5h-6.5"/>',
  wallet:'<path d="M3 7.5h14.5A2.5 2.5 0 0120 10v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7.5zm0 0L5.5 4H17"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  life:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.4"/><path d="M6 6l3.6 3.6M18 6l-3.6 3.6M6 18l3.6-3.6M18 18l-3.6-3.6"/>',
  down:'<path d="M12 4.5v11M7.5 11.5L12 16l4.5-4.5M4.5 19.5h15"/>',
  up:'<path d="M12 19.5v-11M7.5 12.5L12 8l4.5 4.5M4.5 4.5h15"/>',
  trend:'<path d="M3 16.5l5.5-6 4 3.5 5-6.5"/><path d="M21 4.5h-4M21 4.5v4"/>',
  people:'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.6-3 2.9-4.6 5.5-4.6S14 16 14.6 19"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M16 14.6c2.2.2 3.9 1.8 4.4 4.4"/>',
  bank:'<path d="M3.5 9.5L12 4.5l8.5 5"/><path d="M5.5 9.5v8M9.5 9.5v8M14.5 9.5v8M18.5 9.5v8M3 20.5h18"/>',
  card:'<rect x="2.8" y="5.5" width="18.4" height="13" rx="2.4"/><path d="M2.8 10h18.4M6.5 14.5h3.5"/>',
  q:'<circle cx="12" cy="12" r="8.6"/><path d="M9.7 9.6a2.4 2.4 0 114 1.9c-.9.7-1.7 1.1-1.7 2.3M12 17v.1"/>',
  bulb:'<path d="M9.2 17.5h5.6M10 20.5h4"/><path d="M12 3.5a5.6 5.6 0 00-3.3 10.1c.5.4.8 1 .8 1.6h5c0-.6.3-1.2.8-1.6A5.6 5.6 0 0012 3.5z"/>',
  mail:'<rect x="2.8" y="5" width="18.4" height="14" rx="2.4"/><path d="M3.4 6.6l8.6 6 8.6-6"/>',
  home:'<path d="M4 11l8-6.6 8 6.6v8.2a1 1 0 01-1 1h-4.5V14h-5v6.2H5a1 1 0 01-1-1V11z"/>',
  bolt:'<path d="M13.2 3L5.5 13.6h5.6L10.4 21l7.9-10.6h-5.7L13.2 3z"/>',
  list:'<rect x="4" y="3.4" width="16" height="17.2" rx="2.6"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/>',
  dots:'<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
  shield:'<path d="M12 3.4l7.4 3v5c0 4.5-3 8.5-7.4 9.8C7.6 19.9 4.6 15.9 4.6 11.4v-5l7.4-3z"/>',
  spark:'<path d="M12 3.5l1.7 4.8 4.8 1.7-4.8 1.7L12 16.5l-1.7-4.8-4.8-1.7 4.8-1.7L12 3.5z"/>'
};
const sq = (n, tone) => `<span class="sqi b-${tone}"><svg viewBox="0 0 24 24">${P[n]}</svg></span>`;
const arw = () => `<svg viewBox="0 0 24 24">${P.arrow}</svg>`;

/* ---------- 通信 ----------
   JSONP（scriptタグ）で GAS を呼ぶ。
   ★fetch の POST は使わない。GAS のリダイレクトの都合で JSON ではなく
     HTML のエラーページが返ることがある（実際に踏んだ）。 */
/* ---------- スプラッシュ ---------- */
const SP_AT = Date.now();
/* 取得に10秒前後かかる。同じ文言のままだと固まって見えるので、進み具合を出す */
(function () {
  const el = document.getElementById('spMsg');
  const steps = ['読み込んでいます', '残高を確認しています', '将来残高を計算しています', 'もう少しかかります'];
  const t = setInterval(() => {
    if (!document.getElementById('sp')) return clearInterval(t);
    el.textContent = steps[Math.min(steps.length - 1, Math.floor((Date.now() - SP_AT) / 4000))] + '…';
  }, 900);
})();
/* 動画が実際に再生できたときだけ、CSSの揺れを止める */
(function () {
  const v = document.querySelector('.spVid');
  if (v) {
    v.addEventListener('playing', () => document.getElementById('sp')?.classList.add('hasVideo'), { once: true });
  }
})();
function hideSp() {
  if (qs.get('splash')) return;   // ?splash=1 で出しっぱなしにできる（見た目の確認用）
  const sp = document.getElementById('sp');
  if (!sp || sp.classList.contains('out')) return;
  setTimeout(() => {
    sp.classList.add('out');
    setTimeout(() => sp.remove(), 500);
  }, Math.max(0, 1100 - (Date.now() - SP_AT)));   // 一瞬で消えるとチラつくので最低1.1秒は出す
}

let JN = 0;
function api(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cb = 'bcb' + (++JN);
    const q = new URLSearchParams({ api: action, k: KEY, callback: cb });
    const tok = sessionStorage.getItem('banchou_tok');
    if (tok) q.set('t', tok);
    if (params.act) q.set('act', params.act);
    if (params.payload) q.set('p', JSON.stringify(params.payload));
    const s = document.createElement('script');
    let fired = false;
    const t = setTimeout(() => { done(); reject(new Error('時間切れです。もう一度お試しください。')); }, 240000);
    function done(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { fired = true; done(); resolve(d); };
    /* ★GASはときどきJSONではなくHTMLのページを返す。その場合 script は読み込みに
       成功するのに callback が呼ばれないので、onload で取りこぼしを検出する。
       これが無いとタイムアウトまで待たされる（240秒固まっていた）。 */
    s.onload = () => { if (!fired){ done(); reject(new Error('応答を読み取れませんでした')); } };
    s.onerror = () => { done(); reject(new Error('通信できませんでした')); };
    s.src = GAS_URL + '?' + q.toString();
    document.head.appendChild(s);
  });
}

/* ---------- 判決ブロックの中の小さな折れ線 ----------
   数字だけだと実感が湧かない。谷の形をその場で見せる。 */
function spark(fc){
  const pts = (fc && fc.points) || [];
  if (pts.length < 2) return '';
  const W = 320, H = 54;
  let lo = 0, hi = 0;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  if (hi === lo) hi = lo + 1;
  const X = i => W * (i / (pts.length - 1));
  const Y = v => H - (H - 6) * ((v - lo) / (hi - lo)) - 3;
  let line = '';
  pts.forEach((p, i) => { line += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1); });
  const zero = Y(0);
  let g = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">`;
  g += `<path d="${line} L${W} ${H} L0 ${H} Z" fill="#FF5064" opacity=".14"/>`;
  g += `<line x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}" stroke="#FF5064" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>`;
  g += `<path d="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
  if (fc.firstNeg){
    const i = pts.findIndex(p => p[0] === fc.firstNeg.date);
    if (i >= 0) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(pts[i][1]).toFixed(1)}" r="4" fill="#FFBF24"/>`;
  }
  return g + '</svg>';
}

/* ---------- グラフ ---------- */
function chart(fc) {
  const pts = fc.points || [];
  if (pts.length < 2) return '';
  /* スマホでは横に引き伸ばされて軸の文字が読めなくなるので、
     viewBox を細長くして文字を大きく取る（実測して決めた値） */
  const narrow = window.innerWidth < 700;
  const W  = narrow ? 400 : 720;
  const H  = narrow ? 330 : 320;
  const PL = narrow ? 58  : 78;
  const PR = narrow ? 12  : 18;
  const PT = narrow ? 24  : 26;
  const PB = narrow ? 28  : 34;
  const FS = narrow ? 13  : 10.5;   // 軸ラベル
  const FB = narrow ? 15  : 11;     // 吹き出し
  let lo = 0, hi = 0;
  pts.forEach(p => { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); });
  if (hi === lo) hi = lo + 1;
  let step = Math.pow(10, Math.floor(Math.log10((hi - lo) / 5)));
  while ((hi - lo) / step > 8) step *= 2;
  hi = Math.ceil(hi / step) * step; lo = Math.floor(lo / step) * step;
  const man = v => Math.abs(v) >= 10000
    ? (v < 0 ? '−' : '') + (Math.round(Math.abs(v) / 1000) / 10) + '万'
    : String(Math.round(v));
  const X = i => PL + (W - PL - PR) * (i / (pts.length - 1));
  const Y = v => PT + (H - PT - PB) * (1 - (v - lo) / (hi - lo));

  let line = '', area = '';
  pts.forEach((p, i) => { line += (i ? ' L' : 'M') + X(i).toFixed(1) + ' ' + Y(p[1]).toFixed(1); });
  area = line + ` L${X(pts.length-1).toFixed(1)} ${Y(lo).toFixed(1)} L${X(0).toFixed(1)} ${Y(lo).toFixed(1)} Z`;

  let g = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="将来残高の見通し">`;
  g += `<text x="3" y="${PT-9}" font-size="${FS}" fill="#94A3B8">(円)</text>`;
  for (let v = lo; v <= hi + step/2; v += step) {
    const y = Y(v);
    g += `<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${Math.abs(v)<step/2?'#0B1622':'#EFF2F5'}" stroke-width="${Math.abs(v)<step/2?1.4:1}"/>`;
    g += `<text x="${PL-7}" y="${(y+FS*0.36).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="${v<0?'#D80B2B':'#94A2B1'}">${man(v)}</text>`;
  }
  // 0円より下＝支払えない領域。色で意味を持たせる（飾りではない）
  const zeroY = Y(0);
  if (zeroY < H - PB) g += `<rect x="${PL}" y="${zeroY.toFixed(1)}" width="${W-PL-PR}" height="${(H-PB-zeroY).toFixed(1)}" fill="#D80B2B" opacity=".07"/>`;
  g += `<path d="${area}" fill="#0B1622" opacity=".06"/>`;
  g += `<path d="${line}" fill="none" stroke="#0B1622" stroke-width="2.4" stroke-linejoin="round"/>`;

  if (fc.firstNeg) {
    const ni = pts.findIndex(p => p[0] === fc.firstNeg.date);
    if (ni >= 0) {
      const cx = X(ni), cy = Y(pts[ni][1]);
      g += `<line x1="${cx.toFixed(1)}" y1="${PT}" x2="${cx.toFixed(1)}" y2="${H-PB}" stroke="#D80B2B" stroke-width="1.2" opacity=".5"/>`;
      g += `<line x1="${PL}" y1="${cy.toFixed(1)}" x2="${W-PR}" y2="${cy.toFixed(1)}" stroke="#D80B2B" stroke-width="1.2" stroke-dasharray="5 4" opacity=".5"/>`;
      g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5.5" fill="#FFBF24" stroke="#0B1622" stroke-width="2.4"/>`;
      const bw = narrow ? 132 : 136, bh = narrow ? 44 : 40;
      const bx = cx < (PL + W - PR) / 2
        ? Math.min(W - PR - bw, cx + 16)
        : Math.max(PL, cx - bw - 16);
      const by = Math.max(PT, cy - bh - 20);
      g += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#0B1622"/>`;
      g += `<rect x="${bx}" y="${by}" width="${bw}" height="3" fill="#FFBF24"/>`;
      g += `<text x="${bx+bw/2}" y="${by+(narrow?20:19)}" text-anchor="middle" font-size="${FB-2}" font-weight="700" fill="#94A2B1">${esc(fc.firstNeg.date.slice(5).replace('-','/'))} に不足</text>`;
      g += `<text x="${bx+bw/2}" y="${by+(narrow?38:35)}" text-anchor="middle" font-size="${FB+1}" font-weight="700" fill="#FF5064">−${yen(fc.firstNeg.bal).slice(1)}</text>`;
    }
  }
  const every = Math.max(1, Math.round(pts.length / (narrow ? 4 : 7)));
  for (let t = 0; t < pts.length; t += every)
    g += `<text x="${X(t).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="${FS}" fill="#94A3B8">${Number(pts[t][0].slice(5,7))}/${Number(pts[t][0].slice(8,10))}</text>`;
  return g + '</svg>';
}

/* ---------- 対策カードの組み立て ---------- */
function actionCards(d) {
  const short = d.funds.short, out = [];
  const simOn = {};
  (d.actions.sims || []).forEach(s => { simOn[s.type + '|' + (s.label || '')] = s; });

  const card = (key, tone, icon, title, desc, effLabel, effVal, btn, pill, attrs) => {
    const on = simOn[key];
    return `<div class="ac${on ? ' on' : ''}">
      <div class="acH">${sq(icon, tone)}<div style="min-width:0">
        <div class="acT">${title}${on ? '<span class="chip">反映中</span>' : ''}</div>
        <div class="acD">${desc}</div></div></div>
      <div class="acF">
        <div><div class="acE">${effLabel}</div><div class="acA">${effVal}</div></div>
        ${on ? `<button class="pill p-gray" data-act="remove" data-id="${esc(on.id)}">取り消す</button>`
             : `<button class="pill p-${pill}" ${attrs}>${btn}${arw()}</button>`}
      </div></div>`;
  };

  if (d.funds.sub > 0) {
    const need = short < 0 ? Math.min(Math.abs(short), d.funds.sub) : d.funds.sub;
    // 引落日が無いこともあるので、その場合は「明日」を振替日にする
    const base = isDate(d.funds.due) ? new Date(d.funds.due.replace(/-/g, '/')) : new Date();
    base.setDate(base.getDate() + (isDate(d.funds.due) ? -1 : 1));
    const td = ymd(base);
    out.push(card('transfer|個人口座からの振替', 'blue', 'bank',
      `${esc(d.mode.sub)}の ${yen(need)} を<br>${esc(d.mode.main)}へ振り替え`,
      `引落の前日（${esc(td)}）に振り替える想定です`,
      '想定効果', '〜' + yen(need), '振り替える', 'blue',
      `data-act="transfer" data-amount="${need}" data-date="${td}"`));
  }

  out.push(card('__income', 'green', 'people',
    '取引先に入金の前倒しを相談',
    '入金予定を登録すると、見通しに反映されます',
    '想定効果', '登録した金額', '入金を登録', 'green', 'data-act="incoming"'));

  (d.actions.picks || []).slice(0, 3).forEach(p => {
    out.push(card('stopfix|' + p.name, 'green', 'trend',
      `${esc(p.name)} を止める`,
      `月額 ${yen(p.monthly)}／仕分け：${esc(p.tri)}`,
      '来月からの効果', yen(p.monthly) + '/月', '止める', 'green',
      `data-act="stopfix" data-label="${esc(p.name)}" data-amount="${p.monthly}"`));
  });

  if (d.funds.card > 0 && isDate(d.funds.due))
  out.push(`<div class="ac"><div class="acH">${sq('card','purple')}<div style="min-width:0">
      <div class="acT">カードの支払い方法を相談</div>
      <div class="acD">引落 ${esc(d.funds.due)}／${yen(d.funds.card)}。分割や支払日の変更を相談します</div>
    </div></div>
    <div class="acF"><div><div class="acE">想定効果</div><div class="acA">金額は変わりません</div></div>
    <span class="pill p-purple" style="opacity:.55;cursor:default">電話で相談</span></div></div>`);

  return out.join('');
}

/* ---------- 画面 ---------- */
function render() {
  hideSp();
  const d = DATA;
  const short = d.funds.short, ng = short < 0;

  /* --- 危機カード --- */
  /* ★カード引落日は無いことがある（その月に請求が無い・導入直後）。
     日付が空のまま日付処理に渡すと画面が真っ白になる（実際になった）。 */
  const due = isDate(d.funds.due) ? d.funds.due : '';
  const negDay = d.forecast.firstNeg && isDate(d.forecast.firstNeg.date)
    ? d.forecast.firstNeg.date : '';

  const daysLeft = (() => {

function showTab(t) {
  TAB = t;
  const pc = getComputedStyle(document.querySelector('.tabs')).display === 'none';
  document.querySelectorAll('.sect').forEach(el => {
    const own = el.getAttribute('data-tab');
    // PCでは1画面に全部並べる。ただし「その他」と、スマホ用の簡易カード(.mob)は出さない
    el.style.display = (pc ? (own !== 'etc' && !el.classList.contains('mob')) : own === t) ? '' : 'none';
  });
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.getAttribute('data-t') === t));
  if (!pc) window.scrollTo(0, 0);
}

/* ---------- 入金予定の登録シート ----------
   金額と日付は、送る前にこちら側で必ず確かめる。
   GAS側に変な値が入ると、直すのにスプレッドシートを開くことになるため。 */
function askIncome() {
  const today = new Date();
  const d0 = ymd(new Date(today.getTime() + 7 * 86400000));
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="in">
    <h3>入金予定を登録する</h3>
    <div class="foot">登録すると、将来残高の見通しにすぐ反映されます。</div>
    <div id="ierr"></div>
    <div class="fld"><label>金額</label>
      <input id="iamt" type="text" inputmode="numeric" placeholder="200000" />
      <div class="hint">半角数字だけ。円マークやカンマは要りません</div></div>
    <div class="fld"><label>入金予定日</label>
      <input id="idate" type="date" value="${d0}" /></div>
    <div class="fld"><label>入金元（任意）</label>
      <input id="ilbl" type="text" placeholder="◯◯商事" /></div>
    <div class="btns">
      <button class="no" id="ino">やめる</button>
      <button class="ok" id="iok">登録する</button>
    </div></div>`;
  document.body.appendChild(el);
  setTimeout(() => document.getElementById('iamt').focus(), 60);

  return new Promise(resolve => {
    const close = v => { el.remove(); resolve(v); };
    el.addEventListener('click', e => { if (e.target === el) close(null); });
    document.getElementById('ino').onclick = () => close(null);
    document.getElementById('iok').onclick = () => {
      const bad = m => { document.getElementById('ierr').innerHTML = `<div class="bad">${esc(m)}</div>`; };
      // 日本語キーボードだと全角で入る。半角に直してから読む（弾かれて入力できなかった）
      const half = String(document.getElementById('iamt').value)
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
      const amt = Number(half.replace(/[^\d]/g, ''));
      const dt = document.getElementById('idate').value;
      if (!amt) return bad('金額を入れてください。');
      if (amt > 100000000) return bad('金額が大きすぎます。桁を確かめてください。');
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return bad('入金予定日を選んでください。');
      if (dt < ymd()) return bad('過去の日付は登録できません。');
      close({ amount: String(amt), date: dt,
              label: document.getElementById('ilbl').value.trim() || '入金予定' });
    };
  });
}

/* ---------- Googleログイン ----------
   スプレッドシート側で「GoogleログインのクライアントID」が設定されたときだけ、
   サーバが needLogin を返す。設定されていない間はこの画面は一切出ない。

const GOOGLE_CLIENT_ID = '';   // ← Kaiがクライアントを作ったらここに入れる

function askLogin(msg) {
  hideSp();
  document.getElementById('app').innerHTML = `
  <div class="gate">
    <img src="icon-192.png" alt="" />
    <h1>せつやく番長</h1><div class="hdS">資金のピンチは、俺が止める。</div>

      <button class="pill p-gray" style="margin:12px 0 0" data-act="logout">合言葉に戻す</button>

  const s = document.createElement('script');

  };
  document.head.appendChild(s);
}

/* ---------- 操作 ---------- */
document.addEventListener('click', async ev => {
  const tb = ev.target.closest('.tb');       if (tb) return showTab(tb.getAttribute('data-t'));
  const go = ev.target.closest('[data-go]'); if (go) return showTab(go.getAttribute('data-go'));

  const btn = ev.target.closest('#btn');
  if (btn) {
    if (BUSY) return;
    BUSY = true; btn.classList.add('spin');
    const msg = document.getElementById('msg');
    /* ★1回で全部やらないこと。まとめると3分かかり、スマホで画面を離れた時点で
       結果を受け取れず「更新できない」ように見える（実際にそう見えていた）。
       取り込み(約6秒)と再計算(約70秒)に分けて、それぞれの結果を出す。 */
    const t0 = Date.now();
    let tick = null;
    const say = (label, note) => {
      clearInterval(tick);
      const start = Date.now();
      const draw = () => {
        const s = Math.round((Date.now() - start) / 1000);
        msg.innerHTML = `<div class="busy">${esc(label)}…
          <div class="bar"><i></i></div><small>${esc(note)}／経過 ${s}秒</small></div>`;
      };
      draw(); tick = setInterval(draw, 1000);
    };
    /* ★時間のかかる処理は再試行しないこと。
       応答が届かなかっただけで、サーバ側では動き続けている。
       再試行すると二重に走り、ロック待ちで倍以上待たされる（実際に175秒待たされた）。
       取り込みは数秒で終わり重複も除かれるので、そこだけ再試行する。 */
    const step = async (action, label, note, retry) => {
      say(label, note);
      let r, err;
      for (let i = 0; i < (retry ? 2 : 1); i++) {
        try { r = await api(action); break; }
        catch (e2) { err = e2; if (retry) await new Promise(x => setTimeout(x, 1500)); }
      }
      if (!r) throw err || new Error('応答がありませんでした');
      if (!r.ok) throw new Error(r.error || '失敗しました');
      return r;
    };
    try {
      const imp = await step('import', 'メールを取り込んでいます', '数秒で終わります', true);
      let lost = false;
      try {
        await step('rebuild', '取引を集計して将来残高を計算しています', '1分ほどかかります', false);
      } catch (e3) {
        // 応答は届かなかったが、集計自体は続いている。少し待ってから結果を見に行く
        lost = true;
        say('集計の結果を待っています', 'もう少しかかります');
        await new Promise(x => setTimeout(x, 20000));
      }
      clearInterval(tick);
      await load();
      const sec = Math.round((Date.now() - t0) / 1000);
      document.getElementById('msg').innerHTML =
        `<div class="done">${imp.added > 0
            ? `メールから ${imp.added} 件を取り込みました。`
            : '新しいメールはありませんでした。'}${lost ? '' : `集計を更新しました（${sec}秒）。`}</div>`;
    } catch (e) {
      clearInterval(tick);
      msg.innerHTML = `<div class="err">更新できませんでした：${esc(e.message)}
        <button data-act="reload">もう一度試す</button></div>`;
    }
    btn.classList.remove('spin');
    BUSY = false;
    return;
  }

  const el = ev.target.closest('[data-act], [data-act2]');
  if (!el) return;
  const a = el.getAttribute('data-act') || el.getAttribute('data-act2');

  if (a === 'reload') { location.reload(); return; }
  if (a === 'logout') {
    localStorage.removeItem('banchou_key');
    sessionStorage.removeItem('banchou_tok');
    location.href = location.pathname;
    return;
  }

  const p = {};
  if (a === 'transfer') { p.amount = el.getAttribute('data-amount'); p.date = el.getAttribute('data-date'); }
  else if (a === 'stopfix') { p.label = el.getAttribute('data-label'); p.amount = el.getAttribute('data-amount'); }
  else if (a === 'remove' || a === 'incok' || a === 'incng') { p.id = el.getAttribute('data-id'); }
  else if (a === 'incoming') {
    const v = await askIncome();
    if (!v) return;
    Object.assign(p, v);
  }
  const was = el.tagName === 'BUTTON' ? el.innerHTML : null;
  if (was !== null) { el.disabled = true; el.style.opacity = '.5'; el.textContent = '反映中…'; }
  try {
    // 通信は取りこぼすことがある。ここも黙って2回まで取り直す
    let ok, err;
    for (let i = 0; i < 2; i++) {
      try { ok = await api('sim', { act: a, payload: p }); break; }
      catch (e2) { err = e2; await new Promise(r => setTimeout(r, 1200)); }
    }
    if (!ok) throw err || new Error('反映できませんでした');
    if (!ok.ok) throw new Error(ok.error || '反映できませんでした');
    await load();
  } catch (e) {
    /* ★失敗したらボタンを必ず元に戻すこと。
       戻さないと「反映中…」のまま押せなくなり、再読み込みするしかなくなる。 */
    if (was !== null) { el.disabled = false; el.style.opacity = ''; el.innerHTML = was; }
    const m = document.getElementById('msg');
    if (m) {
      m.innerHTML = `<div class="err">反映できませんでした：${esc(e.message)}
        <button data-act="reload">もう一度試す</button></div>`;
      m.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
});

/* ---------- 起動 ---------- */
async function load() {
  if (!KEY) { askKey(''); return; }
  try {
    // GASはときどきJSONを返さない。実測で3回に1回ほど起きるので、黙って取り直す
    let d, last;
    for (let i = 0; i < 3; i++) {
      try { d = await api('stats'); break; }
      catch (e) {
        last = e;
        if (/合言葉/.test(String(e.message))) throw e;
        await new Promise(r => setTimeout(r, 1200 * (i + 1)));
      }
    }
    if (!d) throw last || new Error('取得できませんでした');
    if (!d.ok && d.needLogin) { sessionStorage.removeItem('banchou_tok'); askLogin(d.error); return; }
    if (!d.ok) throw new Error(d.error || '取得できませんでした');
    DATA = d; render();
  } catch (e) {
    const m = String(e.message || '');
    if (/合言葉/.test(m)) { localStorage.removeItem('banchou_key'); askKey('合言葉が違います。もう一度入れてください。'); return; }
    hideSp();
    document.getElementById('app').innerHTML =
      `<div class="err"><b>データを取得できませんでした。</b><br>${esc(m)}
       <button data-act="reload">もう一度試す</button></div>`;
  }
}
window.addEventListener('resize', () => { if (DATA) showTab(TAB); });
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
